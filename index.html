const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(pw){
 const salt=b64(P.salt),iv=b64(P.iv),ct=b64(P.ct),mac=b64(P.mac);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:P.it,hash:'SHA-256'},base,512));
 const hk=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 const msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
 if(!await crypto.subtle.verify('HMAC',hk,mac,msg))return false;
 const ek=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CTR',false,['decrypt']);
 const z=await crypto.subtle.decrypt({name:'AES-CTR',counter:iv,length:128},ek,ct);
 const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
 document.open();document.write(html);document.close();return true}
const f=document.getElementById('f'),er=document.getElementById('er'),go=document.getElementById('go');
f.onsubmit=async e=>{e.preventDefault();er.textContent='';go.disabled=true;go.textContent='여는 중…';const pw=document.getElementById('pw').value;
 try{const ok=await openWith(pw);if(ok){try{(document.getElementById('rm')?.checked?localStorage:sessionStorage).setItem('bb_pw',pw)}catch(_){};return}
  er.textContent='비밀번호가 맞지 않습니다.'}catch(x){er.textContent='이 브라우저에서는 열 수 없습니다. 최신 크롬·엣지·사파리를 사용해 주세요.'}
 go.disabled=false;go.textContent='열기'};
(async()=>{let s=null;try{s=sessionStorage.getItem('bb_pw')||localStorage.getItem('bb_pw')}catch(_){}
 if(s){try{if(await openWith(s))return}catch(_){}try{localStorage.removeItem('bb_pw');sessionStorage.removeItem('bb_pw')}catch(_){}}})();
